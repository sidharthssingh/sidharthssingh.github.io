<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidharth Singh | Terminal</title>
  <meta name="description" content="Sidharth Singh - Senior Product Manager. Engineer turned PM. Building products at the intersection of AI, data & consumer experience.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="terminal">
    <div id="terminal-header">
      <div class="terminal-buttons">
        <span class="btn-close"></span>
        <span class="btn-minimize"></span>
        <span class="btn-maximize"></span>
      </div>
      <div class="terminal-title">sidharth@portfolio ~ %</div>
    </div>
    <div id="terminal-body">
      <div id="output"></div>
      <div id="input-line">
        <span class="prompt">visitor@sidharth.dev ~ $&nbsp;</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        <span id="tab-hint" class="tab-hint"></span>
      </div>
    </div>
  </div>
  <div id="mobile-hint">Tap anywhere to start typing</div>
  <script src="script.js"></script>
</body>
</html>
